<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiranaConnect | Chat Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-image: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23ffffff" fill-opacity="0.03" fill-rule="evenodd"%3E%3Ccircle cx="3" cy="3" r="3"/%3E%3Ccircle cx="13" cy="13" r="3"/%3E%3C/g%3E%3C/svg%3E');
        }

        .message {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            line-height: 1.4;
            animation: slideIn 0.3s ease-out;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bg-secondary);
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 1rem;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="dark-theme">
    <nav class="sidebar">
        <div class="logo">
            <span class="logo-icon">🏪</span>
            <h2>KiranaConnect</h2>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">📊 Dashboard</a></li>
            <li><a href="#">📦 Inventory</a></li>
            <li class="active"><a href="chat.html">💬 Mock WhatsApp</a></li>
            <li><a href="#">📈 Analytics</a></li>
            <li><a href="#">⚙️ Settings</a></li>
        </ul>
    </nav>
    <main class="content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="avatar">🤖</div>
                <div>
                    <h2 style="font-size: 1.1rem; margin: 0;">KiranaConnect AI Agent</h2>
                    <span style="font-size: 0.8rem; opacity: 0.8;">Online</span>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message bot">
                    Hello! I'm your AI Inventory Assistant. How can I help you today?
                    <br><br>
                    Try saying:
                    <br>- "Bought 50 Parle G"
                    <br>- "Check stock"
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..."
                    aria-label="Message">
                <button class="send-btn" id="send-btn" aria-label="Send">
                    ➤
                </button>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        // Chat specific UI logic
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Add user message to UI
            addMessage(text, 'user');
            chatInput.value = '';

            // Send to backend via App setup
            const responseText = await window.sendMessageToAPI(text);

            // Add bot response to UI
            addMessage(responseText, 'bot');
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>

</html>
